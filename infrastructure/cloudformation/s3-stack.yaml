AWSTemplateFormatVersion: '2010-09-09'
Description: S3 buckets with lifecycle policies for the serverless data platform

Parameters:
  Stage:
    Type: String

Resources:
  # ========================================
  # Archive Bucket
  # ========================================
  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "serverless-platform-${Stage}-archive-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 90
          - Id: ExpireOldObjects
            Status: Enabled
            ExpirationInDays: 365
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: data-archive
        - Key: Stage
          Value: !Ref Stage

  # ========================================
  # Data Bucket (processed outputs)
  # ========================================
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "serverless-platform-${Stage}-data-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
          - Id: ExpireOldExports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600
      Tags:
        - Key: Purpose
          Value: processed-data
        - Key: Stage
          Value: !Ref Stage

  # ========================================
  # Deployment Bucket
  # ========================================
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "serverless-platform-${Stage}-deployment"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: deployment-artifacts
        - Key: Stage
          Value: !Ref Stage

Outputs:
  ArchiveBucketName:
    Value: !Ref ArchiveBucket
  ArchiveBucketArn:
    Value: !GetAtt ArchiveBucket.Arn
  DataBucketName:
    Value: !Ref DataBucket
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
